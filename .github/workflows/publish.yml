name: Publish

# Stable semver tags only (v1.2.3). Pre-release tags (v1.2.3-rc.1) don't
# match, so they can't land on npm's `latest` dist-tag by accident.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  npm-publish:
    needs: ci
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    # Fails fast if the tag doesn't match package.json's version.
    uses: oxHive/pipelines/.github/workflows/npm-publish.yml@v2
    with:
      package-path: .
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
